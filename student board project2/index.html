
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Board</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>Student Board</h1>
    <p>Student results and performance</p>
  </header>

  <main>
    <section class="summary">
      <div class="summary-card">
        <h2>Total Students</h2>
        <p id="student-count">0</p>
      </div>

      <div class="summary-card">
        <h2>Average Score</h2>
        <p id="average-score">0</p>
      </div>

      <div class="summary-card">
        <h2>Top Students</h2>
        <p id="top-students">None</p>
      </div>
    </section>

    <h2 class="section-title">Our Students</h2>

    <section id="student-list" class="student-grid">
      <!-- JavaScript will create student cards here -->
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Student Board</p>
  </footer>

</body>
</html>
